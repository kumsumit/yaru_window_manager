name: yaru_window_manager
description: |
  A window_manager -based implementation of yaru_window for macOS and Windows.
repository: https://github.com/ubuntu/yaru_window.dart
issue_tracker: https://github.com/ubuntu/yaru_window.dart/issues
version: 0.1.3
publish_to: none

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  window_manager: ^0.7.0
  yaru_window_platform_interface: 
    git: https://github.com/kumsumit/yaru_window_platform_interface.git

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  ubuntu_lints: ^0.4.2

flutter:
  plugin:
    implements: yaru_window
    platforms:
      macos:
        dartPluginClass: YaruWindowManager
      windows:
        dartPluginClass: YaruWindowManager
